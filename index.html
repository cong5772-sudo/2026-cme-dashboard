<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보수교육 이수 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face{font-family:"S-Core Dream";font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:500;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:600 800;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff") format("woff")}
:root{
  --bg:#f3f5f9;--surface:#ffffff;--sunk:#edf1f7;--ink:#0f172a;--ink2:#475569;--muted:#64748b;
  --line:#e3e8f0;--line2:#cbd5e1;--accent:#1e3a6e;--accent-ink:#fff;--accent-soft:#e6edfa;
  --face:#2563eb;--online:#f59e0b;--online-ink:#b45309;--exempt:#94a3b8;--crit:#e11d48;--crit-soft:#ffe9ee;--crit-ink:#be123c;
  --good:#16a34a;--good-ink:#15803d;--warn-soft:#fef3c7;--warn-ink:#92400e;
  --f-ui:"S-Core Dream","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--surface:#121b2d;--sunk:#0e1626;--ink:#e8eef8;--ink2:#b6c2d6;--muted:#8393ab;
  --line:#1f2c44;--line2:#2c3b57;--accent:#7aa7ff;--accent-ink:#0b1220;--accent-soft:#18284a;
  --face:#5b9bff;--online:#fbbf24;--online-ink:#fbbf24;--exempt:#64748b;--crit:#fb7185;--crit-soft:#3a1623;--crit-ink:#fda4af;
  --good-ink:#4ade80;--warn-soft:#3a2f12;--warn-ink:#fcd34d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600;margin:0}
header .hright{margin-left:auto;display:flex;align-items:center;gap:18px}
.org{text-align:right;line-height:1.35}.org b{display:block;font-size:13px;font-weight:600;color:var(--accent)}.org span{font-size:11.5px;color:var(--muted)}
header .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid var(--line)}
@media(max-width:640px){header{padding:10px 14px}header h1{font-size:15px;width:100%}header .hright{margin-left:0;width:100%;justify-content:space-between;gap:10px}.org{text-align:left}header .meta{padding-left:10px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot[data-s=live]{background:var(--good)}.dot[data-s=stale]{background:var(--online)}.dot[data-s=error]{background:var(--crit)}
button{font:inherit;color:inherit;cursor:pointer}
.icon{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:3px 9px}
nav.top{display:flex;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.navbtn{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink2);white-space:nowrap;font-weight:500}
.navbtn[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.fg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fg.mo .chip{padding:3px 9px;font-size:12px}.fl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
select,input[type=search],input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 9px}
main{max-width:1180px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.k4{grid-template-columns:1fr 1fr}.k3{grid-template-columns:1fr 1fr}.k2{grid-template-columns:1fr}}
@media(max-width:480px){.k4,.k3{grid-template-columns:1fr 1fr}main{padding:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.lbl{font-size:12px;color:var(--muted)}.big{font-size:28px;font-weight:600;line-height:1.25;margin:2px 0}
.sub{font-size:12px;color:var(--ink2)}
h2{font-size:15px;margin:0 0 4px;font-weight:600}.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.c-face{color:var(--face)}.c-online{color:var(--online-ink)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.crit{background:var(--crit-soft);color:var(--crit-ink)}.tag.good{background:#dcfce7;color:var(--good-ink)}.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.bar{height:14px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}.b-face{background:var(--face)}.b-online{background:var(--online)}.b-ex{background:var(--exempt)}.b-crit{background:var(--crit)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.gh td{background:var(--sunk);font-weight:600}tr.sub td{background:var(--sunk);font-weight:500;color:var(--ink2)}
tr.over td:first-child{box-shadow:inset 3px 0 0 var(--crit)}tr.over{background:var(--crit-soft)}
tfoot td{font-weight:600;border-top:2px solid var(--line2);border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.cmp{display:grid;grid-template-columns:64px 1fr 150px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.cmp .v{text-align:right;color:var(--ink2);font-size:12px}
@media(max-width:480px){.cmp{grid-template-columns:48px 1fr}.cmp .v{grid-column:1/-1;text-align:left}}
.lock{max-width:380px;margin:32px auto;text-align:center}
.lock input{width:100%;margin:10px 0}.lock .go{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px;font-weight:600}
.err{color:var(--crit-ink);font-size:12px;min-height:18px}
.msg{padding:48px 16px;text-align:center;color:var(--ink2)}
.banner{background:var(--warn-soft);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
nav.bottom{display:none}
@media(max-width:640px){
  nav.top{display:none}
  .filters{position:static;gap:8px;padding:8px 12px}.filters .fg{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:9}
  nav.bottom button{flex:1;border:0;background:none;padding:7px 2px;font-size:11px;color:var(--muted)}
  nav.bottom button b{display:block;font-size:16px;font-weight:400;line-height:1.2}
  nav.bottom button[aria-current=page]{color:var(--accent);font-weight:600}
  main{padding-bottom:84px}
}
.printhead,.printfoot{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm 13mm}
  :root{--bg:#fff;--surface:#fff;--sunk:#eef2f2;--ink:#111;--ink2:#333;--muted:#555;--line:#c9d3d4;--line2:#9aa9aa;--accent:#1e3a6e;
    --face:#2563eb;--online:#f59e0b;--crit-soft:#ffe9ee;--crit-ink:#be123c}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;color:#111;font-size:10pt}
  .side,header,nav.top,nav.bottom,.filters,.screen-only,.banner,main>.grid,.tools,.hint,.np{display:none!important}
  .shell{display:block;padding:0;max-width:none}
  main{max-width:none;padding:0;margin:0}
  .card{border:0;border-radius:0;padding:0;background:none}
  .tw{overflow:visible}
  .printhead{display:block;margin-bottom:7mm}
  .printhead h1{font-size:17pt;font-weight:600;margin:0 0 3mm;padding-bottom:2.5mm;border-bottom:1.5pt solid var(--accent)}
  .pmeta{display:flex;gap:9mm;font-size:10pt;color:#333}.pmeta b{color:#000;margin-right:1.5mm}
  .psum{margin-top:3.5mm;padding:2.5mm 4mm;background:var(--sunk);border-radius:2mm;font-size:10.5pt}.psum b{font-weight:600}
  table{font-size:9pt}
  th,td{padding:1.1mm 2.2mm;border-bottom:0.4pt solid var(--line)}
  thead th{border-bottom:1pt solid var(--line2);color:#222;font-weight:600}
  tr{break-inside:avoid}
  tr.gh td{background:var(--sunk);font-weight:600}
  tr.sub td{font-weight:600;background:#f6f8f8}
  tfoot td{font-weight:700;border-top:1.2pt solid #333}
  tfoot{display:table-row-group}
  tbody.grp{break-inside:avoid}
  tbody.pbreak{break-before:page}
  thead{display:table-header-group}
  tr.over{background:var(--crit-soft)}tr.over td:first-child{box-shadow:inset 1.2mm 0 0 #e11d48}
  .bar{height:2.6mm;min-width:32mm;border-radius:0.6mm}
  .printfoot{display:block;margin-top:5mm;font-size:8.5pt;color:#555;line-height:1.6}
}
/* 강조(올해) vs 참고(전년) 위계 */
.hero{gap:14px;margin-bottom:18px}
.hero .card{padding:18px 20px 16px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06)}
.hero .card .lbl{font-size:13px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:7px}
.hero .big{font-size:42px;font-weight:600;letter-spacing:-.5px;line-height:1.15;margin:4px 0 6px}
.hero .sub{font-size:13px}.hero .sub b{font-size:15px;font-weight:600;color:var(--ink)}
.hero .card.t-main{background:var(--accent);border-color:var(--accent);color:#fff}
.hero .t-main .lbl,.hero .t-main .sub{color:rgba(255,255,255,.78)}.hero .t-main .big{color:#fff}
.hero .t-face .lbl::before,.hero .t-online .lbl::before{content:"";width:9px;height:9px;border-radius:50%;flex:none}
.hero .t-face .lbl::before{background:var(--face)}.hero .t-online .lbl::before{background:var(--online)}
.hero .t-ok .big{font-size:34px;color:var(--good-ink)}.hero .t-crit .big{font-size:34px;color:var(--crit)}
.c-ok{color:var(--good-ink)}.c-crit{color:var(--crit)}
.ref{background:transparent!important;border:1px dashed var(--line2)!important;box-shadow:none;padding:12px 14px}
.ref h2{font-size:13px;color:var(--ink2);font-weight:500}.ref .hint{margin-bottom:6px}
.ref .bar{height:11px}
.ref .cmp{font-size:12px;margin:5px 0;color:var(--ink2)}
.refk{gap:8px}.refk .card{padding:8px 12px;background:var(--surface);border-color:var(--line)}
.refk .big{font-size:19px;font-weight:500;color:var(--ink)}.refk .big.c-face{color:var(--face)}.refk .big.c-online{color:var(--online-ink)}
.refk .lbl{font-size:11px}.ref .note{font-size:11px}
.side{display:contents}.navbtn .ic{display:none}
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;max-width:none;margin:0;padding:0 24px;align-items:start}
  .side{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;margin-top:20px}
  nav.top{flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;gap:2px;overflow:visible}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;font-size:14px}
  .navbtn .ic{display:inline;font-size:16px;width:20px;text-align:center}
  .filters{position:static;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 4px}
  .filters .fg{margin-bottom:14px;gap:6px}
  .filters .fl{display:block;width:100%;font-size:12px;font-weight:500;color:var(--ink2);margin:0 0 2px}
  .filters .fg.mo{display:grid;grid-template-columns:repeat(4,1fr)}.filters .fg.mo .fl{grid-column:1/-1}
  .filters .fg.mo .chip{padding:4px 0;text-align:center}
  main{max-width:1700px;margin:0;padding:20px 0 28px}
}
/* 넓은 모니터: 화면 폭에 비례해 전체 크기를 키워 여백·작아 보이는 느낌 해소 */
@media(min-width:1600px){body{zoom:1.1}}
@media(min-width:1800px){body{zoom:1.2}}
@media(min-width:2200px){body{zoom:1.38}}
@media(min-width:2800px){body{zoom:1.7}}
@media print{body{zoom:1!important}}
@media(max-width:480px){.hero .big{font-size:32px}.hero .card{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>간호국 보수교육 이수 대시보드</h1>
  <div class="hright">
    <div class="org"><b>인제대학교 해운대백병원 간호국</b><span>관리자(교육파트장)</span></div>
    <div class="meta"><span class="dot" id="dot" data-s="stale"></span><span id="upd">–</span><button class="icon" id="refresh" title="지금 새로 불러오기" aria-label="새로고침">⟳</button></div>
  </div>
</header>
<div class="shell">
<aside class="side"><nav class="top" id="navtop"></nav><div class="filters" id="filters"></div></aside>
<main id="view"><div class="msg">데이터를 불러오는 중입니다…</div></main>
</div>
<nav class="bottom" id="navbot"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
